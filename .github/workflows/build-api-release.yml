name: Build API Docker Release CI

on:
  release:
    # Run when a release is published (use the release's tag_name)
    types: [published]
  workflow_dispatch:

jobs:
  build:
    # Only run for releases with a tag that starts with 'v' (e.g. v1.2.3)
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./NineLanCacheUI-API
          file: ./NineLanCacheUI-API/NineLanCacheUI-API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nine-lancache-ui:api-${{ github.event.release.tag_name }}
            ${{ secrets.DOCKER_USERNAME }}/nine-lancache-ui:api
