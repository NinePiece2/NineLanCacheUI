name: Build UI Docker Release CI

on:
  release:
    # Run when a release is published (use the release's tag_name)
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./NineLanCacheUI
          file: ./NineLanCacheUI/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nine-lancache-ui:ui-${{ github.event.release.tag_name }}
            ${{ secrets.DOCKER_USERNAME }}/nine-lancache-ui:ui
            ghcr.io/ninepiece2/ninelancacheui:ui-${{ github.event.release.tag_name }}
            ghcr.io/ninepiece2/ninelancacheui:ui
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            BUILD_DATE=${{ github.event.release.created_at }}
            VCS_REF=${{ github.sha }}
