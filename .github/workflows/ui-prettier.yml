name: Prettier CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - NineLanCacheUI/**

concurrency:
  group: prettier-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NineLanCacheUI

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npx prettier --write .

      - name: Block changes to .github/
        run: |
          if git diff --name-only | grep -q '^\.github/'; then
            echo "Error: Prettier attempted to modify files in .github/"
            git diff --name-only | grep '^\.github/'
            exit 1
          fi

      - name: Commit formatted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --exit-code || git commit -m "chore: apply Prettier formatting"

      - name: Push changes
        run: |
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git push origin HEAD:refs/heads/${{ github.head_ref }}
          else
            git push origin HEAD:refs/heads/${{ github.ref_name }}
          fi
