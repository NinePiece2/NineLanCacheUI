name: PR Lint Test UI

on:
  pull_request:
    branches:
      - main
    paths:
      - NineLanCacheUI/**

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NineLanCacheUI

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install

      - name: Run build
        env:
            CI: false
        run: npm run lint